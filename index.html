<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<meta name="theme-color" content="#171946" />
<title>For Your 23</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Ma+Shan+Zheng&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  font-family:
    "PingFang SC",
    "Microsoft YaHei",
    "Noto Sans SC",
    system-ui,
    sans-serif;
  background:#0f1437;
  color:#fff;
}
button{font:inherit;}
button,#story{touch-action:manipulation;}

:root{
  --bg1:#10163c;
  --bg2:#202259;
  --bg3:#462474;
  --bg4:#153f75;

  --glass-line:rgba(255,255,255,.18);
  --glass-inner:rgba(255,255,255,.06);

  --sheet-bg1:rgba(255,255,255,.050);
  --sheet-bg2:rgba(255,255,255,.010);

  --sheet-line:rgba(255,255,255,.16);
  --sheet-inner:rgba(255,255,255,.05);
}

.hand-cn{
  font-family:
    "Ma Shan Zheng",
    "KaiTi",
    "STKaiti",
    cursive;
}

.hand-en{
  font-family:
    "Caveat",
    cursive;
}

/* =========================================================
   APP / BACKGROUND
========================================================= */

#app{
  position:relative;
  width:100%;
  height:100vh;
  height:100svh;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(circle at 11% 15%, rgba(82,136,255,.96), transparent 29%),
    radial-gradient(circle at 86% 16%, rgba(194,89,255,.85), transparent 31%),
    radial-gradient(circle at 50% 86%, rgba(54,214,255,.66), transparent 39%),
    radial-gradient(circle at 50% 44%, rgba(255,255,255,.07), transparent 24%),
    linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 34%, var(--bg3) 67%, var(--bg4) 100%);
}

/* =========================================================
   NEBULA
========================================================= */

.nebula{
  position:absolute;
  z-index:1;
  border-radius:50%;
  pointer-events:none;
  filter:blur(100px);
  mix-blend-mode:screen;
  animation:nebulaFloat 12s ease-in-out infinite alternate;
}
.nebula.a{
  width:48vw;height:48vw;
  left:-14vw;top:6vh;
  background:rgba(107,153,255,.48);
}
.nebula.b{
  width:44vw;height:44vw;
  right:-13vw;top:-12vh;
  background:rgba(208,102,255,.40);
  animation-delay:-4s;
}
.nebula.c{
  width:40vw;height:40vw;
  left:32vw;bottom:-19vh;
  background:rgba(58,224,255,.33);
  animation-delay:-8s;
}
@keyframes nebulaFloat{
  from{transform:translate3d(-2%,0,0) scale(.92);}
  to{transform:translate3d(10%,8%,0) scale(1.17);}
}

/* =========================================================
   GRID / VIGNETTE
========================================================= */

.mesh{
  position:absolute;
  inset:0;
  z-index:2;
  opacity:.05;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.40) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.40) 1px, transparent 1px);
  background-size:46px 46px;
  mask-image:
    radial-gradient(circle at center, black 0%, transparent 78%);
}

.vignette{
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
  background:
    radial-gradient(circle at center,
      transparent 24%,
      rgba(4,7,29,.08) 62%,
      rgba(3,5,22,.44) 100%);
}

/* =========================================================
   CANVAS
========================================================= */

#constellationCanvas,
#fxCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
#constellationCanvas{
  z-index:5;
  mix-blend-mode:screen;
}
#fxCanvas{z-index:35;}

/* =========================================================
   FLASH
========================================================= */

#flash{
  position:absolute;
  inset:0;
  z-index:34;
  opacity:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle at var(--flash-x,50%) var(--flash-y,50%),
      rgba(255,255,255,.96) 0%,
      rgba(193,215,255,.62) 6%,
      rgba(155,125,255,.24) 18%,
      transparent 48%
    );
}
#flash.boom{
  animation:flashBoom .72s ease-out;
}
@keyframes flashBoom{
  0%{opacity:0;}
  9%{opacity:.88;}
  28%{opacity:.38;}
  100%{opacity:0;}
}

/* =========================================================
   INTRO
========================================================= */

#intro{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:
    radial-gradient(circle at center,
      rgba(100,104,205,.07),
      rgba(7,10,38,.18));
  backdrop-filter:blur(2px);
  transition:opacity .85s ease, transform .85s ease;
}
#intro.leave{
  opacity:0;
  transform:scale(1.08);
  pointer-events:none;
}
.intro-title{
  margin-bottom:28px;
  font-size:12px;
  letter-spacing:.35em;
  color:rgba(255,255,255,.72);
}
.intro-title .hand-en{
  font-size:20px;
  letter-spacing:.04em;
  display:block;
  margin-top:6px;
  color:rgba(255,255,255,.86);
}

/* =========================================================
   ENVELOPE
========================================================= */

#envelope{
  position:relative;
  width:310px;
  height:202px;
  max-width:82vw;
  border:0;
  outline:0;
  cursor:pointer;
  background:transparent;
  perspective:1100px;
  filter:drop-shadow(0 30px 42px rgba(7,11,42,.30));
  transition:transform .3s ease;
}
#envelope:hover{
  transform:translateY(-5px) rotate(-1deg) scale(1.02);
}
#envelope:active{
  transform:scale(.97);
}

.env-back{
  position:absolute;
  inset:0;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.25);
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.02));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(125,151,255,.08),
    0 0 75px rgba(133,115,255,.13);
  backdrop-filter:blur(12px) saturate(120%);
}
.env-letter{
  position:absolute;
  left:50%;
  top:30px;
  width:226px;
  height:130px;
  transform:translateX(-50%);
  border-radius:14px;
  border:1px solid rgba(255,255,255,.20);
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.05),
      rgba(255,255,255,.01));
  backdrop-filter:blur(8px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    0 12px 36px rgba(15,20,68,.12);
  transition:transform 1s cubic-bezier(.16,.90,.23,1);
}
.env-front{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:62%;
  border-radius:0 0 24px 24px;
  border:1px solid rgba(255,255,255,.18);
  border-top:0;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.015));
  backdrop-filter:blur(10px);
  clip-path:polygon(0 0, 50% 72%, 100% 0, 100% 100%, 0 100%);
}
.env-flap{
  position:absolute;
  inset:0;
  transform-origin:top center;
  clip-path:polygon(0 0, 50% 61%, 100% 0, 100% 73%, 0 73%);
  border-radius:24px 24px 0 0;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.02));
  border-top:1px solid rgba(255,255,255,.23);
  backdrop-filter:blur(12px);
  transition:transform .95s cubic-bezier(.18,.86,.24,1), opacity .6s ease;
}
.env-line{
  position:absolute;
  z-index:4;
  pointer-events:none;
  background:rgba(255,255,255,.20);
  box-shadow:0 0 9px rgba(148,177,255,.12);
}
.env-line.left{
  width:1px;height:128px;
  left:78px;bottom:5px;
  transform:rotate(-51deg);
  transform-origin:bottom;
}
.env-line.right{
  width:1px;height:128px;
  right:78px;bottom:5px;
  transform:rotate(51deg);
  transform-origin:bottom;
}
.seal-dot{
  position:absolute;
  z-index:6;
  left:50%;top:52%;
  transform:translate(-50%,-50%);
  width:15px;height:15px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.23);
  background:rgba(255,255,255,.05);
  box-shadow:0 0 18px rgba(152,136,255,.25);
  transition:opacity .4s ease, transform .5s ease;
}

#envelope.open .env-flap{
  transform:rotateX(180deg);
  opacity:.14;
}
#envelope.open .env-letter{
  transform:translate(-50%,-82px) scale(1.08);
}
#envelope.open .seal-dot{
  opacity:0;
  transform:translate(-50%,-50%) scale(2);
}

.intro-hint{
  margin-top:31px;
  font-size:12px;
  letter-spacing:.12em;
  color:rgba(255,255,255,.60);
  animation:breathe 1.8s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.38;}
  50%{opacity:.95;}
}

/* =========================================================
   STORY
========================================================= */

#story{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:68px 28px 145px;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
}
#story.show{
  opacity:1;
  pointer-events:auto;
}

/* =========================================================
   SHEET
========================================================= */

#letterSheet{
  position:relative;
  width:min(760px, 84vw);
  min-height:clamp(380px,56vh,540px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:68px 62px 58px;
  overflow:hidden;
  border-radius:20px;
  border:1px solid var(--sheet-line);
  background:
    linear-gradient(145deg,
      var(--sheet-bg1),
      var(--sheet-bg2));
  backdrop-filter:blur(8px) saturate(115%);
  -webkit-backdrop-filter:blur(8px) saturate(115%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    0 24px 80px rgba(5,11,54,.15),
    0 0 100px rgba(126,112,255,.04);
  cursor:pointer;
  user-select:none;
  transition:transform .5s ease, opacity .5s ease, filter .5s ease;
}

/* 信纸边线 */
#letterSheet::before{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:14px;
  border:1px solid var(--sheet-inner);
  pointer-events:none;
}

/* 右上折角 */
#letterSheet::after{
  content:"";
  position:absolute;
  right:0;
  top:0;
  width:92px;
  height:92px;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,.18),
      rgba(255,255,255,.03));
  clip-path:polygon(0 0,100% 0,100% 100%);
  border-left:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);
  opacity:.45;
  pointer-events:none;
}

.sheet-corner{
  position:absolute;
  width:42px;height:42px;
  opacity:.30;
  pointer-events:none;
}
.sheet-corner::before,
.sheet-corner::after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.34);
  box-shadow:0 0 10px rgba(129,178,255,.12);
}
.sheet-corner::before{width:26px;height:1px;}
.sheet-corner::after{width:1px;height:26px;}
.sheet-corner.tl{left:24px;top:24px;}
.sheet-corner.tr{right:24px;top:24px;transform:rotate(90deg);}
.sheet-corner.bl{left:24px;bottom:24px;transform:rotate(-90deg);}
.sheet-corner.br{right:24px;bottom:24px;transform:rotate(180deg);}

#eyebrow{
  position:relative;
  z-index:4;
  margin-bottom:22px;
  font-size:10px;
  letter-spacing:.45em;
  text-transform:uppercase;
  color:rgba(235,241,255,.52);
  transition:opacity .3s ease;
}

#storyText{
  position:relative;
  z-index:4;
  width:100%;
  min-height:220px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  text-wrap:balance;
  color:rgba(255,255,255,.93);
  text-shadow:
    0 0 22px rgba(255,255,255,.07),
    0 0 58px rgba(136,123,255,.15);
}

.story-line{
  display:block;
  opacity:0;
  transform:translateY(18px);
  filter:blur(8px);
  font-size:clamp(20px,2.35vw,30px);
  line-height:1.95;
  font-weight:400;
  letter-spacing:.025em;
  animation:lineIn .82s cubic-bezier(.18,.88,.23,1) forwards;
  animation-delay:calc(var(--i) * 160ms);
}

.story-line.hw{
  font-family:
    "Ma Shan Zheng",
    "KaiTi",
    "STKaiti",
    cursive;
  letter-spacing:.01em;
  font-size:clamp(24px,2.8vw,36px);
  line-height:1.8;
  color:rgba(255,255,255,.98);
  text-shadow:
    0 0 20px rgba(255,255,255,.12),
    0 0 70px rgba(143,124,255,.22);
}

#letterSheet[data-mode="hero"] .story-line{
  font-size:clamp(82px,13vw,158px);
  line-height:1;
  font-weight:180;
  letter-spacing:.08em;
  text-shadow:
    0 0 35px rgba(255,255,255,.25),
    0 0 100px rgba(142,115,255,.36);
}

#letterSheet[data-mode="date"] .story-line:first-child{
  font-size:clamp(42px,7vw,74px);
  font-weight:230;
  letter-spacing:.12em;
  margin-bottom:14px;
}

#letterSheet[data-mode="quiet"] .story-line{
  font-weight:350;
  letter-spacing:.03em;
}

@keyframes lineIn{
  0%{
    opacity:0;
    transform:translateY(20px) scale(.97);
    filter:blur(11px);
  }
  65%{
    opacity:.95;
    filter:blur(2px);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

#letterSheet.leaving{
  opacity:0;
  filter:blur(11px);
  transform:translateY(-14px) scale(1.02);
}

#letterSheet.dissolve{
  opacity:0;
  filter:blur(18px);
  transform:scale(1.03) rotate(.4deg);
}

#continueHint{
  position:absolute;
  z-index:4;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:10px;
  letter-spacing:.14em;
  color:rgba(235,240,255,.38);
  animation:breathe 1.9s ease-in-out infinite;
}

/* =========================================================
   RIPPLE / RINGS
========================================================= */

#glassRipple{
  position:absolute;
  z-index:2;
  width:20px;height:20px;
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  border:1px solid rgba(255,255,255,.56);
  box-shadow:0 0 25px rgba(116,188,255,.24);
}
#glassRipple.go{animation:glassRipple .9s ease-out;}
@keyframes glassRipple{
  0%{
    opacity:.7;
    transform:translate(-50%,-50%) scale(.2);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(24);
  }
}

.ring{
  position:absolute;
  z-index:1;
  left:50%;top:50%;
  width:min(470px,62vw);
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid rgba(185,195,255,.14);
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(.25);
}
.ring.second{
  width:min(620px,76vw);
  border-style:dashed;
  border-color:rgba(97,218,255,.12);
}
.ring.third{
  width:min(335px,46vw);
  border-color:rgba(255,255,255,.18);
}
.ring.go{animation:ringBlast 1.1s ease-out;}
@keyframes ringBlast{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.25);
  }
  18%{opacity:.84;}
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.2);
  }
}

/* =========================================================
   PLAYER
========================================================= */

#player{
  position:absolute;
  z-index:60;
  right:max(3vw, env(safe-area-inset-right));
  bottom:max(4vh, env(safe-area-inset-bottom));
  opacity:0;
  pointer-events:none;
  transform:rotate(-6deg) translateY(12px);
  transform-origin:right bottom;
  transition:opacity .7s ease, transform .7s ease;
}
#player.show{
  opacity:1;
  pointer-events:auto;
  transform:rotate(-6deg) translateY(0);
}

#playerHint{
  width:max-content;
  margin-left:auto;
  margin-bottom:9px;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(12px);
  font-size:10px;
  letter-spacing:.05em;
  color:rgba(255,255,255,.62);
  box-shadow:0 10px 35px rgba(2,7,31,.12);
  transition:opacity .4s ease, transform .4s ease;
}

.turntable{
  position:relative;
  width:170px;
  height:134px;
  border-radius:29px;
  border:1px solid rgba(255,255,255,.16);
  cursor:pointer;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.08),
      rgba(255,255,255,.016));
  backdrop-filter:blur(14px) saturate(120%);
  color:#fff;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 24px 64px rgba(2,7,32,.26),
    0 0 65px rgba(132,114,255,.08);
  transition:transform .25s ease;
}
.turntable:hover{
  transform:translateY(-4px) rotate(1deg);
}
.turntable:active{
  transform:scale(.97);
}

.vinyl{
  position:absolute;
  left:16px;top:18px;
  width:88px;height:88px;
  overflow:hidden;
  border-radius:50%;
  background:
    radial-gradient(circle,
      #12152c 0 13%,
      #1c2039 14% 25%,
      #070913 26% 100%);
  box-shadow:
    0 10px 24px rgba(0,0,0,.34),
    inset 0 0 0 1px rgba(255,255,255,.055);
}
.vinyl::before{
  content:"";
  position:absolute;inset:0;
  border-radius:50%;
  background:
    conic-gradient(from 23deg,
      transparent 0 11%,
      rgba(255,255,255,.09) 15%,
      transparent 23% 55%,
      rgba(255,255,255,.055) 62%,
      transparent 71%);
}
.vinyl.playing{
  animation:vinylSpin 4.8s linear infinite;
}
@keyframes vinylSpin{to{transform:rotate(360deg);}}

.groove{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.052);
}
.g1{inset:7px;}
.g2{inset:14px;}
.g3{inset:21px;}
.g4{inset:29px;}

.record-cover{
  position:absolute;
  left:50%;top:50%;
  width:38px;height:38px;
  overflow:hidden;
  border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 0 22px rgba(121,143,255,.30);
}
.record-cover img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  pointer-events:none;
  user-select:none;
}
.record-cover::after{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:5px;height:5px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(255,255,255,.94);
}

.tonearm{
  position:absolute;
  right:17px;top:17px;
  width:42px;height:89px;
  transform-origin:31px 8px;
  transition:transform .72s cubic-bezier(.18,.86,.28,1);
}
.tonearm.playing{transform:rotate(25deg);}
.arm-base{
  position:absolute;
  right:0;top:0;
  width:18px;height:18px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.21);
}
.arm-stick{
  position:absolute;
  right:9px;top:12px;
  width:3px;height:67px;
  transform:rotate(19deg);
  transform-origin:top center;
  border-radius:999px;
  background:linear-gradient(#9197b5,#eef2ff);
}
.arm-head{
  position:absolute;
  left:1px;bottom:0;
  width:15px;height:10px;
  border-radius:3px;
  transform:rotate(19deg);
  background:rgba(244,247,255,.94);
}
#musicState{
  position:absolute;
  right:15px;bottom:12px;
  font-size:9px;
  letter-spacing:.25em;
  color:rgba(255,255,255,.56);
}

/* =========================================================
   FINAL
========================================================= */

#finalScene{
  position:absolute;
  inset:0;
  z-index:45;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 28px 125px;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.1s ease;
}
#finalScene.show{opacity:1;}

#finalGlass{
  position:relative;
  width:min(880px,88vw);
  min-height:clamp(430px,60vh,590px);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:34px;
  border:1px solid rgba(255,255,255,.16);
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.040),
      rgba(255,255,255,.006));
  backdrop-filter:blur(9px) saturate(115%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    0 35px 120px rgba(2,7,35,.18),
    0 0 120px rgba(126,114,255,.05);
  transform:translateY(45px) scale(.96);
  opacity:0;
  transition:

<script>
(() => {

];

/* =========================================================
   DOM
========================================================= */

const app = document.getElementById("app");
const intro = document.getElementById("intro");
const envelope = document.getElementById("envelope");

const story = document.getElementById("story");
const sheet = document.getElementById("letterSheet");
const eyebrow = document.getElementById("eyebrow");
const storyText = document.getElementById("storyText");
const hint = document.getElementById("continueHint");
const ripple = document.getElementById("glassRipple");
const ring1 = document.getElementById("ring1");
const ring2 = document.getElementById("ring2");
const ring3 = document.getElementById("ring3");
const flash = document.getElementById("flash");

const player = document.getElementById("player");
const playerHint = document.getElementById("playerHint");
const musicButton = document.getElementById("musicButton");
const vinyl = document.getElementById("vinyl");
const tonearm = document.getElementById("tonearm");
const musicState = document.getElementById("musicState");
const music = document.getElementById("music");

const finalScene = document.getElementById("finalScene");
const finalGlass = document.getElementById("finalGlass");
const giant23 = document.getElementById("giant23");
const finalLead = document.getElementById("finalLead");
const finalMessage = document.getElementById("finalMessage");
const finalWordEls = [
  document.getElementById("word1"),
  document.getElementById("word2"),
  document.getElementById("word3"),
  document.getElementById("word4"),
];

const fxCanvas = document.getElementById("fxCanvas");
const fx = fxCanvas.getContext("2d");
const constellationCanvas = document.getElementById("constellationCanvas");
const starCtx = constellationCanvas.getContext("2d");

/* =========================================================
   STATE
========================================================= */

let started = false;
let currentSlide = 0;
let transitioning = false;
let finaleStarted = false;

let W = 0;
let H = 0;
let DPR = 1;

let stars = [];
let dust = [];
let comets = [];

let bursts = [];
let collapseParticles = [];
let streamParticles = [];

let constellationPulse = 0;
let constellationOpacity = .90;
let constellationTargetOpacity = .90;

const reducedMotion =
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {
  const rect = app.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  fxCanvas.width = Math.round(W * DPR);
  fxCanvas.height = Math.round(H * DPR);
  fxCanvas.style.width = W + "px";
  fxCanvas.style.height = H + "px";
  fx.setTransform(DPR,0,0,DPR,0,0);

  constellationCanvas.width = Math.round(W * DPR);
  constellationCanvas.height = Math.round(H * DPR);
  constellationCanvas.style.width = W + "px";
  constellationCanvas.style.height = H + "px";
  starCtx.setTransform(DPR,0,0,DPR,0,0);

  createUniverse();
}

/* =========================================================
   UNIVERSE
========================================================= */

function createUniverse() {
  const mobile = W < 700;

  const starCount = reducedMotion ? 0 : (mobile ? 90 : 160);
  const dustCount = reducedMotion ? 0 : (mobile ? 110 : 190);
  const cometCount = reducedMotion ? 0 : (mobile ? 7 : 14);

  stars = Array.from({ length: starCount }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: .45 + Math.random() * 1.9,
    alpha: .14 + Math.random() * .62,
    phase: Math.random() * Math.PI * 2,
    vx: (Math.random() - .5) * .075,
    vy: -.02 - Math.random() * .09,
  }));

  dust = Array.from({ length: dustCount }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: .45 + Math.random() * 2.3,
    alpha: .025 + Math.random() * .14,
    vx: (Math.random() - .5) * .055,
    vy: (Math.random() - .5) * .055,
    color: Math.random() > .5 ? "#73d8ff" : "#ae83ff",
  }));

  comets = Array.from({ length: cometCount }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    len: 45 + Math.random() * 100,
    angle: -.95 + Math.random() * .45,
    speed: .07 + Math.random() * .14,
    alpha: .03 + Math.random() * .11
  }));
}

/* =========================================================
   VIRGO
   更接近处女座常见线稿：
   Zavijava / Porrima / Auva / Vindemiatrix / Heze / Zaniah / Syrma / Spica
========================================================= */

function getVirgoLayout() {
  const mobile = W < 700;

  const mapW = mobile ? W * .86 : Math.min(W * .60, 760);
  const mapH = mobile ? H * .48 : Math.min(H * .68, 620);

  const offsetX = mobile ? W * .04 : W * .04;
  const offsetY = mobile ? H * .07 : H * .06;

  // 0 Zavijava
  // 1 Porrima
  // 2 Auva
  // 3 Vindemiatrix
  // 4 Heze
  // 5 Zaniah
  // 6 Syrma
  // 7 Spica (最亮)
  // 8 branch
  // 9 branch
  const stars = [
    [0.12, 0.18],
    [0.26, 0.30],
    [0.42, 0.38],
    [0.59, 0.23],
    [0.60, 0.39],
    [0.73, 0.36],
    [0.84, 0.54],
    [0.55, 0.70],
    [0.68, 0.55],
    [0.35, 0.55],
  ];

  const lines = [
    [0,1],
    [1,2],
    [2,4],
    [4,5],
    [5,6],
    [4,8],
    [8,6],
    [2,7],
    [1,9],
    [9,7],
    [2,3],
    [3,5]
  ];

  const points = stars.map(([x,y]) => ({
    x: offsetX + x * mapW,
    y: offsetY + y * mapH
  }));

  return { points, lines, mapW, mapH, offsetX, offsetY };
}

function drawConstellation() {
  starCtx.clearRect(0,0,W,H);

  constellationOpacity +=
    (constellationTargetOpacity - constellationOpacity) * .03;

  const { points, lines, offsetX, mapW, offsetY, mapH } = getVirgoLayout();
  const t = performance.now() / 1000;

  starCtx.save();
  starCtx.globalAlpha = constellationOpacity;

  // lines
  for (const [a,b] of lines) {
    const p1 = points[a];
    const p2 = points[b];

    const g = starCtx.createLinearGradient(p1.x,p1.y,p2.x,p2.y);
    g.addColorStop(0, "rgba(116,199,255,.12)");
    g.addColorStop(.5,"rgba(198,177,255,.56)");
    g.addColorStop(1, "rgba(107,219,255,.13)");

    starCtx.strokeStyle = g;
    starCtx.lineWidth = 1;
    starCtx.shadowBlur = 12;
    starCtx.shadowColor = "rgba(152,173,255,.52)";

    starCtx.beginPath();
    starCtx.moveTo(p1.x,p1.y);
    starCtx.lineTo(p2.x,p2.y);
    starCtx.stroke();
  }

  // stars
  points.forEach((p,i) => {
    const pulse =
      .68 + Math.sin(t * 1.35 + i * .75) * .25;

    const extra =
      constellationPulse * (1 + .25 * Math.sin(i * 1.8));

    const isSpica = i === 7;
    const radius = (isSpica ? 3.8 : i === 4 ? 3.0 : 1.8) + extra * 1.2;
    const glowSize = (isSpica ? 24 : 18) + extra * 18;

    const glow =
      starCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,glowSize);

    glow.addColorStop(0, `rgba(255,255,255,${.96 * pulse})`);
    glow.addColorStop(.18, `rgba(155,195,255,${(isSpica ? .90 : .74) * pulse})`);
    glow.addColorStop(1, "rgba(119,124,255,0)");

    starCtx.fillStyle = glow;
    starCtx.beginPath();
    starCtx.arc(p.x,p.y,glowSize,0,Math.PI*2);
    starCtx.fill();

    starCtx.fillStyle = "#ffffff";
    starCtx.beginPath();
    starCtx.arc(p.x,p.y,radius,0,Math.PI*2);
    starCtx.fill();
  });

  starCtx.globalAlpha = constellationOpacity * .42;
  starCtx.font = (W < 700 ? "10px system-ui" : "11px system-ui");
  starCtx.fillStyle = "#e1e7ff";
  starCtx.fillText("V I R G O", offsetX + mapW * .42, offsetY + mapH * .92);

  starCtx.restore();
  constellationPulse *= .92;

  requestAnimationFrame(drawConstellation);
}

/* =========================================================
   FX
========================================================= */

function explode(x,y, giant=false){
  if (reducedMotion) return;

  const mobile = W < 700;
  const count = giant
    ? (mobile ? 180 : 300)
    : (mobile ? 90 : 145);

  for (let i=0;i<count;i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = (giant ? 1.2 : .75) + Math.random() * (giant ? 7.0 : 4.8);

    bursts.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: .008 + Math.random() * .018,
      size: .7 + Math.random() * (giant ? 4.2 : 3),
      color:
        Math.random() < .27
          ? "#ffffff"
          : Math.random() < .52
            ? "#77dfff"
            : "#b18aff",
      type: Math.random() > .74 ? "spark" : "dot"
    });
  }
}

function collapseUniverse(){
  if (reducedMotion) return;

  const centerX = W/2;
  const centerY = H/2;
  const count = W < 700 ? 150 : 240;
  collapseParticles = [];

  for (let i=0;i<count;i++){
    const side = Math.floor(Math.random() * 4);
    let x,y;

    if (side === 0){
      x = Math.random() * W;
      y = -20;
    } else if (side === 1){
      x = W + 20;
      y = Math.random() * H;
    } else if (side === 2){
      x = Math.random() * W;
      y = H + 20;
    } else {
      x = -20;
      y = Math.random() * H;
    }

    collapseParticles.push({
      x, y,
      tx: centerX + (Math.random() - .5) * 35,
      ty: centerY + (Math.random() - .5) * 35,
      life: 1,
      size: .8 + Math.random() * 2.8,
      color: Math.random() > .5 ? "#82deff" : "#b78cff"
    });
  }
}

/* 信纸 → 星图 的流动粒子 */
function dissolveSheetToConstellation(){
  if (reducedMotion) return;

  const sheetRect = sheet.getBoundingClientRect();
  const appRect = app.getBoundingClientRect();
  const { points } = getVirgoLayout();

  const left = sheetRect.left - appRect.left;
  const top = sheetRect.top - appRect.top;
  const width = sheetRect.width;
  const height = sheetRect.height;

  const count = W < 700 ? 150 : 260;
  streamParticles = [];

  for (let i=0;i<count;i++){
    const sx = left + Math.random() * width;
    const sy = top + Math.random() * height;

    const target =
      points[Math.floor(Math.random() * points.length)];

    streamParticles.push({
      x: sx,
      y: sy,
      sx, sy,
      tx: target.x + (Math.random() - .5) * 10,
      ty: target.y + (Math.random() - .5) * 10,
      progress: 0,
      speed: .012 + Math.random() * .018,
      size: .8 + Math.random() * 2.4,
      color: Math.random() > .5 ? "#82deff" : "#b78cff",
      life: 1
    });
  }
}

function drawFX(){
  fx.clearRect(0,0,W,H);
  const t = performance.now() / 1000;

  // dust
  for (const p of dust){
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;

    fx.globalAlpha = p.alpha;
    fx.fillStyle = p.color;
    fx.beginPath();
    fx.arc(p.x,p.y,p.r,0,Math.PI*2);
    fx.fill();
  }

  // stars
  for (const s of stars){
    s.x += s.vx;
    s.y += s.vy;

    if (s.y < -8){
      s.y = H + 8;
      s.x = Math.random() * W;
    }

    const blink = .50 + .50 * Math.sin(t * 1.55 + s.phase);
    fx.globalAlpha = s.alpha * blink;
    fx.fillStyle = "#fff";
    fx.beginPath();
    fx.arc(s.x,s.y,s.r,0,Math.PI*2);
    fx.fill();
  }

  // comets
  for (const c of comets){
    c.x += Math.cos(c.angle) * c.speed;
    c.y += Math.sin(c.angle) * c.speed;

    if (c.x > W + 120 || c.y < -120){
      c.x = -100;
      c.y = H + Math.random() * 180;
    }

    const gradient =
      fx.createLinearGradient(
        c.x, c.y,
        c.x + c.len,
        c.y - c.len * .55
      );

    gradient.addColorStop(0, "rgba(255,255,255,0)");
    gradient.addColorStop(.48, "rgba(255,255,255,.86)");
    gradient.addColorStop(1, "rgba(255,255,255,0)");

    fx.globalAlpha = c.alpha;
    fx.strokeStyle = gradient;
    fx.lineWidth = 1.1;

    fx.beginPath();
    fx.moveTo(c.x,c.y);
    fx.lineTo(c.x + c.len, c.y - c.len * .55);
    fx.stroke();
  }

  // bursts
  bursts = bursts.filter(p => p.life > 0);
  for (const p of bursts){
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= .979;
    p.vy *= .979;
    p.life -= p.decay;

    fx.globalAlpha = Math.max(0,p.life);

    if (p.type === "spark"){
      fx.strokeStyle = p.color;
      fx.lineWidth = 1.2;
      fx.beginPath();
      fx.moveTo(p.x - p.vx * 4, p.y - p.vy * 4);
      fx.lineTo(p.x,p.y);
      fx.stroke();
    } else {
      fx.fillStyle = p.color;
      fx.beginPath();
      fx.arc(p.x,p.y,p.size,0,Math.PI*2);
      fx.fill();
    }
  }

  // collapse particles
  collapseParticles = collapseParticles.filter(p => p.life > .02);
  for (const p of collapseParticles){
    p.x += (p.tx - p.x) * .055;
    p.y += (p.ty - p.y) * .055;
    p.life *= .982;

    fx.globalAlpha = p.life;
    fx.fillStyle = p.color;
    fx.beginPath();
    fx.arc(p.x,p.y,p.size,0,Math.PI*2);
    fx.fill();
  }

  // stream particles (sheet -> constellation)
  streamParticles = streamParticles.filter(p => p.life > .02);
  for (const p of streamParticles){
    p.progress += p.speed;
    const ease = 1 - Math.pow(1 - Math.min(1,p.progress), 3);

    p.x = p.sx + (p.tx - p.sx) * ease;
    p.y = p.sy + (p.ty - p.sy) * ease;

    if (p.progress >= 1) p.life *= .92;

    fx.globalAlpha = Math.min(1,p.life);
    fx.fillStyle = p.color;
    fx.beginPath();
    fx.arc(p.x,p.y,p.size,0,Math.PI*2);
    fx.fill();
  }

  fx.globalAlpha = 1;
  requestAnimationFrame(drawFX);
}

/* =========================================================
   UI FX
========================================================= */

function flashAt(x,y){
  flash.style.setProperty("--flash-x", `${x / W * 100}%`);
  flash.style.setProperty("--flash-y", `${y / H * 100}%`);

  flash.classList.remove("boom");
  void flash.offsetWidth;
  flash.classList.add("boom");
}

function ringBlast(){
  [ring1,ring2,ring3].forEach(ring => ring.classList.remove("go"));
  void ring1.offsetWidth;
  ring1.classList.add("go");
  setTimeout(() => ring2.classList.add("go"), 70);
  setTimeout(() => ring3.classList.add("go"), 145);
}

function glassWave(clientX,clientY){
  const rect = sheet.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  ripple.style.left = x + "px";
  ripple.style.top = y + "px";

  ripple.classList.remove("go");
  void ripple.offsetWidth;
  ripple.classList.add("go");
}

/* =========================================================
   SLIDE RENDER
========================================================= */

function lineToHTML(line, i){
  const obj = typeof line === "string"
    ? { text: line, hw: false }
    : line;

  const extraClass = obj.hw ? " hw" : "";

  return `
    <span
      class="story-line${extraClass}"
      style="--i:${i}"
    >${obj.text}</span>
  `;
}

function renderSlide(index){
  const slide = slides[index];
  sheet.dataset.mode = slide.mode;
  eyebrow.textContent = slide.tag;

  storyText.innerHTML =
    slide.lines
      .map((line, i) => lineToHTML(line, i))
      .join("");

  hint.textContent =
    index === slides.length - 1
      ? "最后一次"
      : "轻触这封信，继续";
}

/* =========================================================
   NEXT
========================================================= */

function goNext(event){
  if (!started || transitioning || finaleStarted) return;

  const appRect = app.getBoundingClientRect();
  const x = event.clientX - appRect.left;
  const y = event.clientY - appRect.top;

  explode(x,y,false);
  flashAt(x,y);
  glassWave(event.clientX,event.clientY);
  ringBlast();
  constellationPulse = 1.2;

  if (currentSlide === slides.length - 1){
    startFinale();
    return;
  }

  transitioning = true;
  sheet.classList.add("leaving");
  eyebrow.style.opacity = "0";

  setTimeout(() => {
    currentSlide++;
    renderSlide(currentSlide);
    sheet.classList.remove("leaving");
    eyebrow.style.opacity = "1";

    setTimeout(() => {
      transitioning = false;
    }, 650);
  }, 390);
}

sheet.addEventListener("pointerdown", goNext);

/* =========================================================
   OPEN
========================================================= */

envelope.addEventListener("click", () => {
  if (started) return;
  started = true;

  envelope.classList.add("open");

  const er = envelope.getBoundingClientRect();
  const ar = app.getBoundingClientRect();

  const x =
    er.left + er.width / 2 - ar.left;
  const y =
    er.top + er.height / 2 - ar.top;

  setTimeout(() => {
    explode(x,y,true);
    flashAt(x,y);
    constellationPulse = 2.6;
  }, 180);

  setTimeout(() => {
    intro.classList.add("leave");
  }, 490);

  setTimeout(() => {
    intro.style.display = "none";
    story.classList.add("show");
    player.classList.add("show");
    renderSlide(0);
  }, 1220);
});

/* =========================================================
   MUSIC
========================================================= */

function setMusicState(playing){
  vinyl.classList.toggle("playing", playing);
  tonearm.classList.toggle("playing", playing);
  musicState.textContent = playing ? "PAUSE" : "PLAY";

  musicButton.setAttribute(
    "aria-label",
    playing ? "暂停音乐" : "播放音乐"
  );

  if (playing){
    playerHint.style.opacity = "0";
    playerHint.style.transform = "translateY(7px)";
    setTimeout(() => {
      playerHint.style.visibility = "hidden";
    }, 450);
  }
}

musicButton.addEventListener("click", async (event) => {
  event.stopPropagation();

  if (music.paused){
    try{
      await music.play();
      setMusicState(true);
    } catch (error){
      playerHint.style.visibility = "visible";
      playerHint.style.opacity = "1";
      playerHint.style.transform = "none";
      playerHint.textContent = "没有找到 music.mp3";
    }
  } else {
    music.pause();
    setMusicState(false);
  }
});

music.addEventListener("play", () => setMusicState(true));
music.addEventListener("pause", () => setMusicState(false));
music.addEventListener("ended", () => setMusicState(false));

/* =========================================================
   FINAL
========================================================= */

function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function startFinale(){
  if (finaleStarted) return;
  finaleStarted = true;

  hint.style.opacity = "0";

  // 先让星图亮起来
  constellationTargetOpacity = 1.0;
  constellationPulse = 2.4;

  dissolveSheetToConstellation();
  sheet.classList.add("dissolve");

  await wait(950);

  story.style.opacity = "0";
  story.style.pointerEvents = "none";

  // 星光汇聚
  collapseUniverse();
  explode(W / 2, H / 2, false);

  await wait(260);

  finalScene.classList.add("show");
  await wait(180);
  finalGlass.classList.add("show");
  await wait(700);

  // 23 出现
  giant23.classList.add("show");
  await wait(1750);

  giant23.classList.add("leave");
  explode(W / 2, H / 2, true);
  constellationPulse = 1.8;

  await wait(780);

  giant23.style.display = "none";

  // 4 个词
  finalLead.classList.add("show");
  await wait(850);

  for (let i=0; i<finalWordEls.length; i++){
    const word = finalWordEls[i];
    word.classList.add("show");
    constellationPulse = 1.0;
    explode(
      W / 2 + (Math.random() - .5) * 50,
      H / 2 + (Math.random() - .5) * 35,
      false
    );

    await wait(1000);
    word.classList.add("hide");
    await wait(500);
  }

  finalLead.style.opacity = "0";
  await wait(700);

  finalWordEls.forEach(word => {
    word.style.display = "none";
  });

  // 最后安静下来
  finalMessage.classList.add("show");
  constellationTargetOpacity = .28;
  constellationPulse = .65;
}

/* =========================================================
   INIT
========================================================= */

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

renderSlide(0);

drawFX();
drawConstellation();

})();
</script>
